name: Deploy Website + Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        working-directory: app
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build web app
        working-directory: app
        run: flutter build web --release --base-href /foodara-ai/app/

      - name: Prepare publish folder
        run: |
          mkdir -p publish/app
          cp -r app/build/web/* publish/app/
          cp -r website/* publish/
          touch publish/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
