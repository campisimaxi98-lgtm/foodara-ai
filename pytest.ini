[pytest]
# FOODARA AI - Pytest Configuration

# Ruta de tests
testpaths = tests

# Patrones de búsqueda
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones
addopts = 
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

# Markers
markers =
    asyncio: async test
    unit: unit test
    integration: integration test
    slow: slow test
