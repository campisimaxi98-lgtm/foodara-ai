version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: foodara-postgres
    environment:
      POSTGRES_USER: foodara
      POSTGRES_PASSWORD: foodara_password_dev
      POSTGRES_DB: foodara_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodara"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodara-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://foodara:foodara_password_dev@postgres:5432/foodara_db
      - DEBUG=True
      - APP_ENV=development
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodara-network

networks:
  foodara-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
